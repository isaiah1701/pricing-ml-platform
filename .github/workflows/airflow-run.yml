name: Execute an explicitly approved Airflow pipeline
on:
  workflow_call:
    inputs:
      dag:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: production-airflow-${{ inputs.dag }}
  cancel-in-progress: false
jobs:
  run:
    if: ${{ vars.ML_PIPELINE_EXECUTION_ENABLED == 'true' }}
    environment: production
    # Configure this variable with a runner label that can reach private Airflow.
    runs-on: ${{ vars.AIRFLOW_RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Trigger and wait for the existing DAG
        env:
          AIRFLOW_API_URL: ${{ vars.AIRFLOW_API_URL }}
          AIRFLOW_API_TOKEN: ${{ secrets.AIRFLOW_API_TOKEN }}
          AIRFLOW_DAG: ${{ inputs.dag }}
          AIRFLOW_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: python scripts/trigger_airflow.py
