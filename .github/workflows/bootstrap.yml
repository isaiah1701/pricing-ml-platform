name: Bootstrap
on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: Explicit supported deployment environment
        type: choice
        options: [production]
        default: production
      confirm_bootstrap:
        description: Establish the GitOps control plane on the existing EKS cluster
        type: boolean
        default: false
      upgrade_argocd:
        description: Explicitly allow changing an existing Argo CD Helm release
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  group: kubernetes-production
  cancel-in-progress: false
jobs:
  bootstrap:
    if: ${{ inputs.confirm_bootstrap && github.ref == 'refs/heads/main' && vars.BOOTSTRAP_ENABLED == 'true' }}
    environment: ${{ inputs.target_environment }}
    runs-on: ${{ vars.EKS_RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a
        with:
          version: v3.20.1
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: ${{ vars.KUBECTL_VERSION || 'v1.35.0' }}
      - name: Install pinned Helmfile
        run: bash scripts/install_helmfile.sh
      - run: python -m pip install PyYAML==6.0.3
      - name: Authenticate to the intended AWS account
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ vars.AWS_BOOTSTRAP_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      - name: Validate target and establish GitOps
        env:
          BOOTSTRAP_ENVIRONMENT: ${{ inputs.target_environment }}
          BOOTSTRAP_UPGRADE_ARGOCD: ${{ inputs.upgrade_argocd }}
          EXPECTED_AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
          AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}
          EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME || 'prod-mlops-prod' }}
          KUBECONFIG: ${{ runner.temp }}/bootstrap-kubeconfig
        run: python -m scripts.bootstrap_gitops
