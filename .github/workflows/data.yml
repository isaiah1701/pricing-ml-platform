name: Data pipeline
on:
  push:
    branches: [main]
    paths:
      - "training/preprocessing/**"
      - "training/validation.py"
      - "training/lineage.py"
      - "feature_repo/**"
      - "pipelines/feature-build.py"
      - ".github/workflows/data.yml"
      - ".github/workflows/airflow-run.yml"
      - "scripts/trigger_airflow.py"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - "training/preprocessing/**"
      - "training/validation.py"
      - "training/lineage.py"
      - "feature_repo/**"
      - "pipelines/feature-build.py"
      - ".github/workflows/data.yml"
      - ".github/workflows/airflow-run.yml"
      - "scripts/trigger_airflow.py"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      execute:
        description: Execute the production DAG (training incurs compute cost)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: data-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv sync --frozen --extra test --extra orchestration
      - run: uv run pytest tests/test_clean.py tests/test_transform.py tests/test_validation.py tests/test_lineage.py tests/test_feature_repo.py tests/test_feature_build_dag.py
  execute:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute && github.ref == 'refs/heads/main' }}
    needs: validate
    uses: ./.github/workflows/airflow-run.yml
    with:
      dag: airbnb_feature_build
    secrets: inherit
