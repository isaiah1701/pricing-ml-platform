name: Docker
on:
  pull_request:
    paths: [serving/**, training/**, pipelines/**, retraining/**, feature_repo/**, monitoring/**, scripts/**, tests/**, pyproject.toml, uv.lock, .github/**]
  push:
    branches: [main]
    paths: [serving/**, training/**, pipelines/**, retraining/**, feature_repo/**, monitoring/**, scripts/**, tests/**, pyproject.toml, uv.lock, .github/**]
  workflow_dispatch:
    inputs:
      component:
        description: Runtime to build and publish
        type: choice
        options: [serving, training]
        default: serving
      create_promotion_pr:
        description: Propose the scanned digest in a GitOps PR
        type: boolean
        default: true
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: false
jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      components: ${{ steps.components.outputs.json }}
      serving: ${{ steps.paths.outputs.serving }}
      training: ${{ steps.paths.outputs.training }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: paths
        with:
          filters: |
            serving:
              - 'serving/app/**'
              - 'serving/__init__.py'
              - 'training/train.py'
              - 'training/__init__.py'
              - '.github/workflows/docker.yml'
            training:
              - 'training/**'
              - 'pipelines/**'
              - 'retraining/**'
              - 'monitoring/*.py'
              - 'feature_repo/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/docker.yml'
      - name: Select changed runtimes
        id: components
        env:
          EVENT: ${{ github.event_name }}
          SELECTED: ${{ inputs.component }}
          SERVING_CHANGED: ${{ steps.paths.outputs.serving }}
          TRAINING_CHANGED: ${{ steps.paths.outputs.training }}
        run: |
          python - <<'PYTHON'
          import json, os
          selected = ([os.environ['SELECTED']] if os.environ['EVENT'] == 'workflow_dispatch'
                      else [name for name in ('serving', 'training') if os.environ[name.upper() + '_CHANGED'] == 'true'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('json=' + json.dumps(selected) + '\n')
          PYTHON
  build:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.serving == 'true' || needs.changes.outputs.training == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build local candidate image
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.component == 'serving') || (github.event_name != 'workflow_dispatch' && needs.changes.outputs.serving == 'true') }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: serving/app/Dockerfile
          push: false
          cache-from: type=gha,scope=ci-serving
          cache-to: type=gha,mode=max,scope=ci-serving
          tags: local/airbnb-price-predictor:sha-${{ github.sha }}

      - name: Build training and Airflow runtime
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.component == 'training') || (github.event_name != 'workflow_dispatch' && needs.changes.outputs.training == 'true') }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: training/Dockerfile
          push: false
          load: true
          cache-from: type=gha,scope=ci-training
          cache-to: type=gha,mode=max,scope=ci-training
          tags: local/airbnb-training:sha-${{ github.sha }}
          build-args: GIT_COMMIT=${{ github.sha }}

      - name: Smoke test Airflow migrations and FAB login setup
        if: ${{ (github.event_name == 'workflow_dispatch' && inputs.component == 'training') || (github.event_name != 'workflow_dispatch' && needs.changes.outputs.training == 'true') }}
        run: |
          docker run --rm \
            -e AIRFLOW_HOME=/tmp/airflow-ci \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=false \
            -e AIRFLOW__CORE__AUTH_MANAGER=airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager \
            local/airbnb-training:sha-${{ github.sha }} sh -ec '
              python -c "import asyncpg; from pipelines.deploy import deployment_dag; assert deployment_dag.dag_id == \"airbnb_model_deploy\""
              airflow db migrate
              airflow fab-db migrate
              airflow users create --username ci-smoke --firstname CI --lastname Smoke --role Admin --email ci@example.invalid --password ci-only-disposable-password
              airflow jobs check --help >/dev/null
            '

  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv sync --frozen --extra test --extra orchestration
      - name: Lint Python
        run: uvx --from ruff==0.16.7 ruff check .
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
      - name: Run all tests
        run: uv run pytest
      - name: Validate monitoring query syntax and duplicate-scrape behavior
        run: |
          uv run python scripts/validate_monitoring.py --rules-output /tmp/mlops-monitoring/dashboard-rules.yml
          cp tests/monitoring/promql.yml /tmp/mlops-monitoring/promql.yml
          docker run --rm -v /tmp/mlops-monitoring:/checks -w /checks --entrypoint /bin/promtool prom/prometheus:v3.5.0 check rules dashboard-rules.yml
          docker run --rm -v /tmp/mlops-monitoring:/checks -w /checks --entrypoint /bin/promtool prom/prometheus:v3.5.0 test rules promql.yml
          docker run --rm -v "$PWD:/work" --entrypoint /bin/promtool prom/prometheus:v3.5.0 check rules /work/monitoring/prometheus/airbnb-alerts.yml

  publish-production:
    needs: [validate, changes, build]
    strategy:
      fail-fast: false
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.AWS_PUBLISH_ENABLED == 'true' && needs.changes.outputs.components != '[]' }}
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    env:
      COMPONENT: ${{ matrix.component }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Authenticate to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@fa648b43de3d4d023bcb3f89ed6940096949c419 # v2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Set immutable image coordinates
        id: images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "repository=${REGISTRY}/prod-mlops-prod-${COMPONENT}" >> "$GITHUB_OUTPUT"
          if [ "$COMPONENT" = serving ]; then
            echo 'dockerfile=serving/app/Dockerfile' >> "$GITHUB_OUTPUT"
            echo 'field=image' >> "$GITHUB_OUTPUT"
          else
            echo 'dockerfile=training/Dockerfile' >> "$GITHUB_OUTPUT"
            echo 'field=trainingImage' >> "$GITHUB_OUTPUT"
          fi
      - name: Build selected runtime for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ steps.images.outputs.dockerfile }}
          load: true
          push: false
          tags: ${{ steps.images.outputs.repository }}:${{ steps.images.outputs.tag }}
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: |
            type=gha,scope=release-${{ env.COMPONENT }}
            type=gha,scope=ci-${{ env.COMPONENT }}
          cache-to: type=gha,mode=max,scope=release-${{ env.COMPONENT }}
      - name: Verify estimator runtime
        env:
          IMAGE: ${{ steps.images.outputs.repository }}:${{ steps.images.outputs.tag }}
        run: >-
          docker run --rm --entrypoint python "$IMAGE"
          -c 'from training.train import CatBoostPriceEnsembleRegressor; assert CatBoostPriceEnsembleRegressor(feature_names=("latitude",)).feature_names == ("latitude",)'
      - name: Scan OS and Python dependencies in the image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.repository }}:${{ steps.images.outputs.tag }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
      - name: Push immutable image and resolve digest
        id: published
        env:
          IMAGE: ${{ steps.images.outputs.repository }}:${{ steps.images.outputs.tag }}
        run: |
          docker push "$IMAGE"
          DIGEST=$(aws ecr describe-images --repository-name "prod-mlops-prod-${COMPONENT}" --image-ids "imageTag=sha-${GITHUB_SHA}" --query 'imageDetails[0].imageDigest' --output text)
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Update environment values only
        uses: mikefarah/yq@6251e95af8df3505def48c71f3119836701495d6 # v4.47.2
        env:
          IMAGE_FIELD: ${{ steps.images.outputs.field }}
          IMAGE_REPOSITORY: ${{ steps.images.outputs.repository }}
          IMAGE_TAG: ${{ steps.images.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.published.outputs.digest }}
        with:
          cmd: >-
            yq -i
            '.[strenv(IMAGE_FIELD)].repository = strenv(IMAGE_REPOSITORY) |
             .[strenv(IMAGE_FIELD)].tag = strenv(IMAGE_TAG) |
             .[strenv(IMAGE_FIELD)].digest = strenv(IMAGE_DIGEST)' serving/helm/values/production.yaml
      - name: Validate production coordinates and published images
        if: ${{ github.event_name == 'push' || inputs.create_promotion_pr }}
        run: |
          python -m pip install PyYAML==6.0.3
          python scripts/validate_aws_deployment.py --check-images
      - name: Open GitOps image promotion pull request
        if: ${{ github.event_name == 'push' || inputs.create_promotion_pr }}
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gitops/${{ env.COMPONENT }}-${{ github.sha }}
          delete-branch: true
          add-paths: serving/helm/values/production.yaml
          commit-message: "deploy: promote ${{ env.COMPONENT }} sha-${{ github.sha }}"
          title: "Deploy ${{ env.COMPONENT }} sha-${{ github.sha }}"
          body: |
            Promotes one scanned runtime by immutable ECR digest. Does not train models.
            Review and merge, explicitly sync the existing Argo application, then verify readiness and inference.
          labels: deployment,gitops
