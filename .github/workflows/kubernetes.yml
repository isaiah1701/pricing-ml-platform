name: Kubernetes
on:
  pull_request:
    paths: [helmfile.yaml, scripts/bootstrap_gitops.py, scripts/install_helmfile.sh, serving/helm/**, serving/argocd/**, monitoring/grafana/**, monitoring/prometheus/**, scripts/sync_gitops.py, scripts/verify_rollout.py, scripts/verify_inference.py, .github/workflows/kubernetes.yml]
  push:
    branches: [main]
    paths: [helmfile.yaml, scripts/bootstrap_gitops.py, scripts/install_helmfile.sh, serving/helm/**, serving/argocd/**, monitoring/grafana/**, monitoring/prometheus/**, scripts/sync_gitops.py, scripts/verify_rollout.py, scripts/verify_inference.py, .github/workflows/kubernetes.yml]
  workflow_dispatch:
    inputs:
      deploy:
        description: Sync the selected existing Argo application
        type: boolean
        default: false
      expected_model_version:
        type: string
        default: ""
      application:
        type: choice
        options: [controllers, airbnb-platform, airbnb-inference, prod-mlops-bootstrap]
        default: airbnb-inference
  workflow_call:
    inputs:
      deploy:
        type: boolean
        default: false
      expected_model_version:
        type: string
        default: ""
      application:
        type: string
        default: airbnb-inference
    outputs:
      deployed:
        value: ${{ jobs.deploy.outputs.deployed }}
permissions:
  contents: read
  id-token: write
jobs:
  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install pinned Helmfile
        run: bash scripts/install_helmfile.sh
      - name: Validate bootstrap ownership and Helmfile offline
        run: |
          python -m pip install PyYAML==6.0.3
          helmfile -e production build > /tmp/helmfile-state.yaml
          python -c 'import yaml; from scripts.bootstrap_gitops import validate_helmfile; validate_helmfile(yaml.safe_load(open("/tmp/helmfile-state.yaml")))'
          helmfile -e production lint
      - name: Lint and render workload
        run: |
          helm lint serving/helm
          helm lint serving/helm -f serving/helm/values/base.yaml
          helm lint serving/helm \
            -f serving/helm/values/base.yaml \
            -f serving/helm/values/production.yaml
          helm template airbnb-inference serving/helm \
            --namespace airbnb-inference \
            -f serving/helm/values/base.yaml \
            -f serving/helm/values/production.yaml > rendered-workload.yaml
          helm template airbnb-platform serving/helm \
            --namespace mlflow \
            -f serving/helm/values/base.yaml \
            -f serving/helm/values/production.yaml \
            --set workload.enabled=false \
            --set platform.enabled=true > rendered-platform.yaml
      - name: Render bootstrap resources
        run: |
          helm template prod-mlops-bootstrap serving/helm \
            --namespace argocd \
            -f serving/helm/values/bootstrap.yaml > rendered-bootstrap.yaml
      - name: Validate Kubernetes schemas
        run: |
          docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -ignore-missing-schemas /work/rendered-workload.yaml
          docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -ignore-missing-schemas /work/rendered-bootstrap.yaml
          docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -ignore-missing-schemas /work/rendered-platform.yaml

  deploy:
    needs: manifests
    if: ${{ inputs.deploy && github.ref == 'refs/heads/main' && vars.K8S_DEPLOY_ENABLED == 'true' }}
    environment: production
    runs-on: ${{ vars.EKS_RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 30
    concurrency:
      group: kubernetes-production
      cancel-in-progress: false
    outputs:
      deployed: ${{ steps.sync.outputs.deployed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a
      - run: python -m pip install PyYAML==6.0.3
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ vars.AWS_EKS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with:
          version: ${{ vars.KUBECTL_VERSION || 'v1.35.0' }}
      - name: Configure the existing EKS context
        env:
          CLUSTER: ${{ vars.EKS_CLUSTER_NAME || 'prod-mlops-prod' }}
          REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}
        run: aws eks update-kubeconfig --name "$CLUSTER" --region "$REGION"
      - name: Sync the reviewed Git revision through Argo
        id: sync
        env:
          ARGO_APPLICATION: ${{ inputs.application }}
        run: |
          python -m scripts.sync_gitops
          echo 'deployed=true' >> "$GITHUB_OUTPUT"
      - name: Verify inference at the reviewed model version
        if: ${{ inputs.application == 'airbnb-inference' }}
        env:
          SERVING_URL: ${{ vars.SERVING_URL || 'https://platf0rm.site' }}
          EXPECTED_MODEL_VERSION: ${{ inputs.expected_model_version }}
        run: python scripts/verify_inference.py
