name: ML Training
on:
  push:
    branches: [main]
    paths:
      - "training/**"
      - "!training/preprocessing/**"
      - "pipelines/training.py"
      - "retraining/**"
      - ".github/workflows/ml-training.yml"
      - "scripts/trigger_airflow.py"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - "training/**"
      - "!training/preprocessing/**"
      - "pipelines/training.py"
      - "retraining/**"
      - ".github/workflows/ml-training.yml"
      - "scripts/trigger_airflow.py"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:
    inputs:
      execute:
        description: Execute the production DAG (training incurs compute cost)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: training-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv sync --frozen --extra test --extra orchestration
      - run: uv run pytest tests/test_train.py tests/test_training_checkpoints.py tests/test_training_dag.py tests/test_registry.py tests/test_retraining.py tests/test_retraining_dag.py
  execute:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.execute && github.ref == 'refs/heads/main' && vars.ML_PIPELINE_EXECUTION_ENABLED == 'true' }}
    needs: validate
    environment: production
    runs-on: ${{ vars.AIRFLOW_RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Run the approved Airflow DAG
        env:
          AIRFLOW_API_URL: ${{ vars.AIRFLOW_API_URL }}
          AIRFLOW_API_TOKEN: ${{ secrets.AIRFLOW_API_TOKEN }}
          AIRFLOW_DAG: airbnb_model_training
          AIRFLOW_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}
        run: python scripts/trigger_airflow.py
