name: Publish immutable images and propose GitOps promotion
on:
  push:
    branches: [main]
    paths:
      - serving/app/**
      - serving/__init__.py
      # The estimator class is needed to deserialize existing serving models.
      - training/train.py
      - training/__init__.py
  workflow_dispatch:
    inputs:
      component:
        description: Runtime to publish (model-only promotions need no image build)
        type: choice
        options: [serving, training]
        default: serving
      create_promotion_pr:
        description: Open a promotion PR after publishing
        type: boolean
        default: true
permissions:
  contents: read
concurrency:
  group: production-images-${{ inputs.component || 'serving' }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
      - run: uv sync --frozen --extra test --extra orchestration
      - run: uv run pytest tests/test_serving.py tests/test_model_loader.py tests/test_registry.py
  publish-production:
    needs: validate
    if: ${{ vars.AWS_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    env:
      COMPONENT: ${{ inputs.component || 'serving' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Configure AWS credentials through GitHub OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Authenticate to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Set immutable image coordinates
        id: images
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          echo "tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "repository=${REGISTRY}/prod-mlops-prod-${COMPONENT}" >> "$GITHUB_OUTPUT"
          if [ "$COMPONENT" = serving ]; then
            echo 'dockerfile=serving/app/Dockerfile' >> "$GITHUB_OUTPUT"
            echo 'field=image' >> "$GITHUB_OUTPUT"
          else
            echo 'dockerfile=training/Dockerfile' >> "$GITHUB_OUTPUT"
            echo 'field=trainingImage' >> "$GITHUB_OUTPUT"
          fi
      - name: Build selected runtime for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ steps.images.outputs.dockerfile }}
          load: true
          push: false
          tags: ${{ steps.images.outputs.repository }}:${{ steps.images.outputs.tag }}
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=release-${{ env.COMPONENT }}
          cache-to: type=gha,mode=max,scope=release-${{ env.COMPONENT }}
      - name: Verify estimator runtime
        env:
          IMAGE: ${{ steps.images.outputs.repository }}:${{ steps.images.outputs.tag }}
        run: >-
          docker run --rm --entrypoint python "$IMAGE"
          -c 'from training.train import CatBoostPriceEnsembleRegressor; assert CatBoostPriceEnsembleRegressor(feature_names=("latitude",)).feature_names == ("latitude",)'
      - name: Scan OS and Python dependencies in the image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ${{ steps.images.outputs.repository }}:${{ steps.images.outputs.tag }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          vuln-type: os,library
      - name: Push immutable image and resolve digest
        id: published
        env:
          IMAGE: ${{ steps.images.outputs.repository }}:${{ steps.images.outputs.tag }}
        run: |
          docker push "$IMAGE"
          DIGEST=$(aws ecr describe-images --repository-name "prod-mlops-prod-${COMPONENT}" --image-ids "imageTag=sha-${GITHUB_SHA}" --query 'imageDetails[0].imageDigest' --output text)
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
      - name: Update environment values only
        uses: mikefarah/yq@v4.47.2
        env:
          IMAGE_FIELD: ${{ steps.images.outputs.field }}
          IMAGE_REPOSITORY: ${{ steps.images.outputs.repository }}
          IMAGE_TAG: ${{ steps.images.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.published.outputs.digest }}
        with:
          cmd: >-
            yq -i
            '.[strenv(IMAGE_FIELD)].repository = strenv(IMAGE_REPOSITORY) |
             .[strenv(IMAGE_FIELD)].tag = strenv(IMAGE_TAG) |
             .[strenv(IMAGE_FIELD)].digest = strenv(IMAGE_DIGEST)' serving/helm/values/production.yaml
      - name: Validate production coordinates and published images
        if: ${{ github.event_name == 'push' || inputs.create_promotion_pr }}
        run: |
          python -m pip install PyYAML==6.0.3
          python scripts/validate_aws_deployment.py --check-images
      - name: Open GitOps image promotion pull request
        if: ${{ github.event_name == 'push' || inputs.create_promotion_pr }}
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: gitops/${{ env.COMPONENT }}-${{ github.sha }}
          delete-branch: true
          add-paths: serving/helm/values/production.yaml
          commit-message: "deploy: promote ${{ env.COMPONENT }} sha-${{ github.sha }}"
          title: "Deploy ${{ env.COMPONENT }} sha-${{ github.sha }}"
          body: |
            Promotes one scanned runtime by immutable ECR digest. Does not train models.
            Review and merge, explicitly sync the existing Argo application, then verify readiness and inference.
          labels: deployment,gitops
