name: Terraform Apply
on:
  workflow_dispatch:
    inputs:
      plan_run_id:
        description: Successful Terraform Plan run on main
        type: string
        required: true
      source_sha:
        description: Exact reviewed 40-character plan commit
        type: string
        required: true
      confirm_apply:
        description: Apply the reviewed plan (can change AWS resources)
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
  id-token: write
jobs:
  apply:
    if: ${{ inputs.confirm_apply && github.ref == 'refs/heads/main' && vars.TF_APPLY_ENABLED == 'true' }}
    environment: production
    runs-on: ubuntu-24.04
    concurrency:
      group: terraform-production
      cancel-in-progress: false
    env:
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_STATE_REGION: ${{ vars.AWS_REGION || 'eu-west-2' }}
      PLAN_RUN_ID: ${{ inputs.plan_run_id }}
      PLAN_SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Validate the selected plan workflow run
        id: provenance
        uses: actions/github-script@v7
        with:
          script: |
            const runId = process.env.PLAN_RUN_ID;
            const sha = process.env.PLAN_SOURCE_SHA;
            if (!/^[1-9][0-9]*$/.test(runId) || !/^[0-9a-f]{40}$/.test(sha)) throw new Error('Invalid plan run ID or source SHA');
            const { data: run } = await github.rest.actions.getWorkflowRun({owner: context.repo.owner, repo: context.repo.repo, run_id: Number(runId)});
            const repository = `${context.repo.owner}/${context.repo.repo}`;
            if (run.path !== '.github/workflows/terraform-plan.yml' || run.conclusion !== 'success' ||
                run.head_branch !== 'main' || run.head_sha !== sha ||
                !['push', 'workflow_dispatch'].includes(run.event) || run.head_repository.full_name !== repository) {
              throw new Error('Plan must come from the successful trusted Terraform Plan workflow on main');
            }
            core.setOutput('sha', sha);
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ steps.provenance.outputs.sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: terraform-plan-prod
          run-id: ${{ inputs.plan_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/approved-plan
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TF_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: "1.11.0"
          terraform_wrapper: false
      - name: Verify and apply only the reviewed binary plan
        run: python scripts/terraform_ci.py apply --artifact-dir "$RUNNER_TEMP/approved-plan"
