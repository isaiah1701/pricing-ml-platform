name: Validate model serving

on:
  pull_request:
    paths:
      - .github/**
      - monitoring/**
      - pipelines/**
      - feature_repo/**
      - retraining/**
      - serving/**
      - training/**
      - scripts/**
      - tests/**
      - terraform/**
      - pyproject.toml
      - uv.lock
  push:
    branches: [main]
    paths:
      - .github/**
      - monitoring/**
      - pipelines/**
      - feature_repo/**
      - retraining/**
      - serving/**
      - training/**
      - scripts/**
      - tests/**
      - terraform/**
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      serving: ${{ steps.paths.outputs.serving }}
      training: ${{ steps.paths.outputs.training }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dorny/paths-filter@v3
        id: paths
        with:
          filters: |
            serving:
              - 'serving/app/**'
              - 'serving/__init__.py'
              - 'training/train.py'
              - 'training/__init__.py'
              - '.github/workflows/**'
            training:
              - 'training/**'
              - 'pipelines/**'
              - 'retraining/**'
              - 'monitoring/*.py'
              - 'feature_repo/**'
              - 'scripts/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.github/workflows/**'
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.28"
          enable-cache: true
      - name: Install locked dependencies
        run: |
          uv sync --frozen --extra test --extra orchestration
      - name: Lint all Python
        run: |
          uvx --from ruff==0.16.7 ruff check .
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
      - name: Run all tests
        run: uv run pytest

  image:
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.serving == 'true' || needs.changes.outputs.training == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build local candidate image
        if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.serving == 'true' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: serving/app/Dockerfile
          push: false
          cache-from: type=gha,scope=ci-serving
          cache-to: type=gha,mode=max,scope=ci-serving
          tags: local/airbnb-price-predictor:sha-${{ github.sha }}

      - name: Build training and Airflow runtime
        if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.training == 'true' }}
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: training/Dockerfile
          push: false
          load: true
          cache-from: type=gha,scope=ci-training
          cache-to: type=gha,mode=max,scope=ci-training
          tags: local/airbnb-training:sha-${{ github.sha }}
          build-args: GIT_COMMIT=${{ github.sha }}

      - name: Smoke test Airflow migrations and FAB login setup
        if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.training == 'true' }}
        run: |
          docker run --rm \
            -e AIRFLOW_HOME=/tmp/airflow-ci \
            -e AIRFLOW__CORE__LOAD_EXAMPLES=false \
            -e AIRFLOW__CORE__AUTH_MANAGER=airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager \
            local/airbnb-training:sha-${{ github.sha }} sh -ec '
              python -c "import asyncpg"
              airflow db migrate
              airflow fab-db migrate
              airflow users create --username ci-smoke --firstname CI --lastname Smoke --role Admin --email ci@example.invalid --password ci-only-disposable-password
              airflow jobs check --help >/dev/null
            '

  manifests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a # v4
      - name: Lint and render workload
        run: |
          helm lint serving/helm
          helm lint serving/helm -f serving/helm/values/base.yaml
          helm lint serving/helm \
            -f serving/helm/values/base.yaml \
            -f serving/helm/values/production.yaml
          helm template airbnb-inference serving/helm \
            --namespace airbnb-inference \
            -f serving/helm/values/base.yaml \
            -f serving/helm/values/production.yaml > rendered-workload.yaml
          helm template airbnb-platform serving/helm \
            --namespace mlflow \
            -f serving/helm/values/base.yaml \
            -f serving/helm/values/production.yaml \
            --set workload.enabled=false \
            --set platform.enabled=true > rendered-platform.yaml
      - name: Render bootstrap resources
        run: |
          helm template prod-mlops-bootstrap serving/helm \
            --namespace argocd \
            -f serving/helm/values/bootstrap.yaml > rendered-bootstrap.yaml
      - name: Validate Kubernetes schemas
        run: |
          docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -ignore-missing-schemas /work/rendered-workload.yaml
          docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -ignore-missing-schemas /work/rendered-bootstrap.yaml
          docker run --rm -v "$PWD:/work" ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary -ignore-missing-schemas /work/rendered-platform.yaml

  terraform:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.11.0"
      - name: Format Terraform definitions
        run: terraform fmt -check -recursive terraform
      - name: Validate production Terraform without a backend
        run: |
          terraform -chdir=terraform/bootstrap/prod init -backend=false -input=false
          terraform -chdir=terraform/bootstrap/prod validate
          terraform -chdir=terraform/environments/prod init -backend=false -input=false
          terraform -chdir=terraform/environments/prod validate
