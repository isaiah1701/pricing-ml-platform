global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/airbnb-alerts.yml

scrape_configs:
  - job_name: airbnb-price-predictor
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000
        labels:
          service: airbnb-price-predictor
          environment: local

  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          environment: local
