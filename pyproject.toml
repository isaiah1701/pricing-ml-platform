[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prod-mlops-platform"
version = "0.1.0"
description = "End-to-end MLOps platform for NYC Airbnb price prediction"
requires-python = ">=3.10"
dependencies = [
    "boto3>=1.40,<2",
    "catboost>=1.2,<2",
    "evidently>=0.7.23,<0.8",
    "fastapi>=0.115,<1",
    "feast[redis]>=0.66,<0.67",
    "mlflow>=3.0,<4",
    "pandas>=2.0",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "prometheus-client>=0.20,<1",
    "psycopg2-binary>=2.9,<3",
    "pyarrow>=25.0.1",
    "scikit-learn>=1.4,<2",
    "urllib3>=2.8,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8.0",
]
orchestration = [
    "apache-airflow>=3.3,<3.4",
    "apache-airflow-providers-fab>=3,<4",
    "asyncpg>=0.30,<1",
]

[tool.setuptools.packages.find]
include = ["monitoring*", "pipelines*", "retraining*", "scripts*", "serving*", "training*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
