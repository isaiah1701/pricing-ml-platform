# Small single-node deployment; Argo CD is administered through port-forwarding.
configs:
  params:
    server.insecure: true
dex:
  enabled: false
notifications:
  enabled: false
controller:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
repoServer:
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 1Gi}
server:
  resources:
    requests: {cpu: 25m, memory: 128Mi}
    limits: {memory: 512Mi}
applicationSet:
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}
redis:
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}
