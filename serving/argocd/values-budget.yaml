# Small single-node deployment; HTTPS terminates at the existing Traefik ingress.
global:
  domain: argocd.platf0rm.site
configs:
  cm:
    url: https://argocd.platf0rm.site
    users.anonymous.enabled: false
  params:
    server.insecure: true
dex:
  enabled: false
notifications:
  enabled: false
controller:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {memory: 1Gi}
repoServer:
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    limits: {memory: 1Gi}
server:
  resources:
    requests: {cpu: 25m, memory: 128Mi}
    limits: {memory: 512Mi}
applicationSet:
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}
redis:
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {memory: 256Mi}
