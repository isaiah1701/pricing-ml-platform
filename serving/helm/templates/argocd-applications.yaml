{{- if .Values.bootstrap.enabled }}
{{- $repoURL := required "git.repoURL is required" .Values.git.repoURL }}
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: {{ .Values.project.name }}
  namespace: {{ .Release.Namespace }}
spec:
  description: Airbnb model-serving controllers, secrets, and workload.
  sourceRepos:
    - {{ $repoURL }}
    - {{ .Values.externalSecretsOperator.chartRepo }}
    - {{ .Values.argoRollouts.chartRepo }}
    {{- range $addon := .Values.addons }}
    {{- if $addon.enabled }}
    - {{ $addon.chartRepo }}
    {{- end }}
    {{- end }}
  destinations:
    - namespace: {{ .Values.argoRollouts.namespace }}
      server: {{ .Values.destination.server }}
    - namespace: {{ .Values.externalSecretsOperator.namespace }}
      server: {{ .Values.destination.server }}
    - namespace: {{ .Values.destination.namespace }}
      server: {{ .Values.destination.server }}
    - namespace: {{ .Values.platform.mlflow.namespace }}
      server: {{ .Values.destination.server }}
    - namespace: {{ .Values.platform.airflow.namespace }}
      server: {{ .Values.destination.server }}
    {{- range $addon := .Values.addons }}
    {{- if $addon.enabled }}
    - namespace: {{ $addon.namespace }}
      server: {{ $.Values.destination.server }}
    {{- end }}
    {{- end }}
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
{{- range $key, $addon := .Values.addons }}
{{- if $addon.enabled }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $addon.name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: {{ $addon.syncWave | quote }}
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ $.Values.project.name }}
  source:
    repoURL: {{ $addon.chartRepo }}
    chart: {{ $addon.chart }}
    targetRevision: {{ $addon.chartVersion | quote }}
    helm:
      releaseName: {{ $addon.name }}
      valuesObject:
        {{- toYaml $addon.values | nindent 8 }}
  destination:
    server: {{ $.Values.destination.server }}
    namespace: {{ $addon.namespace }}
  {{- with $addon.ignoreDifferences }}
  ignoreDifferences:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      {{- if $addon.ignoreDifferences }}
      - RespectIgnoreDifferences=true
      {{- end }}
    {{- if $.Values.syncPolicy.automated }}
    automated:
      prune: {{ $.Values.syncPolicy.prune }}
      selfHeal: {{ $.Values.syncPolicy.selfHeal }}
    {{- end }}
{{- end }}
{{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.argoRollouts.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project.name }}
  source:
    repoURL: {{ .Values.argoRollouts.chartRepo }}
    chart: {{ .Values.argoRollouts.chart }}
    targetRevision: {{ .Values.argoRollouts.chartVersion | quote }}
    helm:
      releaseName: {{ .Values.argoRollouts.name }}
      valuesObject:
        dashboard:
          enabled: false
        controller:
          resources:
            requests: {cpu: 25m, memory: 96Mi}
            limits: {memory: 256Mi}
  destination:
    server: {{ .Values.destination.server }}
    namespace: {{ .Values.argoRollouts.namespace }}
  syncPolicy:
    syncOptions: ["CreateNamespace=true", "ServerSideApply=true"]
    {{- if .Values.syncPolicy.automated }}
    automated:
      prune: {{ .Values.syncPolicy.prune }}
      selfHeal: {{ .Values.syncPolicy.selfHeal }}
    {{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ .Values.externalSecretsOperator.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project.name }}
  source:
    repoURL: {{ .Values.externalSecretsOperator.chartRepo }}
    chart: {{ .Values.externalSecretsOperator.chart }}
    targetRevision: {{ .Values.externalSecretsOperator.chartVersion | quote }}
    helm:
      releaseName: {{ .Values.externalSecretsOperator.name }}
      valuesObject:
        installCRDs: true
        resources:
          requests: {cpu: 25m, memory: 64Mi}
          limits: {memory: 192Mi}
        webhook:
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
        certController:
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
        serviceAccount:
          create: true
          name: {{ .Values.externalSecretsOperator.serviceAccountName }}
  destination:
    server: {{ .Values.destination.server }}
    namespace: {{ .Values.externalSecretsOperator.namespace }}
  syncPolicy:
    syncOptions: ["CreateNamespace=true", "ServerSideApply=true"]
    {{- if .Values.syncPolicy.automated }}
    automated:
      prune: {{ .Values.syncPolicy.prune }}
      selfHeal: {{ .Values.syncPolicy.selfHeal }}
    {{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airbnb-platform
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project.name }}
  source:
    repoURL: {{ $repoURL }}
    targetRevision: {{ .Values.git.targetRevision }}
    path: {{ .Values.git.chartPath }}
    helm:
      releaseName: airbnb-platform
      valueFiles: ["values/base.yaml", "values/production.yaml"]
      valuesObject:
        launchValidation: true
        bootstrap:
          enabled: false
        workload:
          enabled: false
        platform:
          enabled: true
        externalSecret:
          enabled: false
  destination:
    server: {{ .Values.destination.server }}
    namespace: {{ .Values.platform.mlflow.namespace }}
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
  syncPolicy:
    syncOptions: ["CreateNamespace=true", "RespectIgnoreDifferences=true"]
    {{- if .Values.syncPolicy.automated }}
    automated:
      prune: {{ .Values.syncPolicy.prune }}
      selfHeal: {{ .Values.syncPolicy.selfHeal }}
    {{- end }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: airbnb-inference
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project.name }}
  source:
    repoURL: {{ $repoURL }}
    targetRevision: {{ .Values.git.targetRevision }}
    path: {{ .Values.git.chartPath }}
    helm:
      releaseName: airbnb-inference
      valueFiles: ["values/base.yaml", "values/production.yaml"]
      valuesObject:
        launchValidation: true
        bootstrap:
          enabled: false
        externalSecret:
          enabled: false
  destination:
    server: {{ .Values.destination.server }}
    namespace: {{ .Values.destination.namespace }}
  syncPolicy:
    syncOptions: ["CreateNamespace=true"]
    {{- if .Values.syncPolicy.automated }}
    automated:
      prune: {{ .Values.syncPolicy.prune }}
      selfHeal: {{ .Values.syncPolicy.selfHeal }}
    {{- end }}
{{- end }}
