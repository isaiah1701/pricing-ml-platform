{{- if and .Values.workload.enabled (not .Values.bootstrap.enabled) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "airbnb.fullname" . }}
  labels:
    {{- include "airbnb.labels" . | nindent 4 }}
data:
  MLFLOW_TRACKING_URI: {{ required "mlflow.trackingUri is required" .Values.mlflow.trackingUri | quote }}
  MODEL_NAME: {{ required "mlflow.modelName is required" .Values.mlflow.modelName | quote }}
  MODEL_ALIAS: {{ required "mlflow.modelAlias is required" .Values.mlflow.modelAlias | quote }}
  TRACING_ENABLED: {{ .Values.mlflow.tracing.enabled | quote }}
  MLFLOW_TRACING_EXPERIMENT_ID: {{ required "mlflow.tracing.experimentId is required" .Values.mlflow.tracing.experimentId | quote }}
  OTEL_SERVICE_NAME: {{ required "mlflow.tracing.serviceName is required" .Values.mlflow.tracing.serviceName | quote }}
  MAX_CONCURRENT_PREDICTIONS: {{ .Values.runtime.maxConcurrentPredictions | quote }}
  PREDICTION_QUEUE_TIMEOUT_SECONDS: {{ .Values.runtime.predictionQueueTimeoutSeconds | quote }}
  OMP_NUM_THREADS: {{ .Values.runtime.nativeThreads | quote }}
  OPENBLAS_NUM_THREADS: {{ .Values.runtime.nativeThreads | quote }}
  MKL_NUM_THREADS: {{ .Values.runtime.nativeThreads | quote }}
  NUMEXPR_NUM_THREADS: {{ .Values.runtime.nativeThreads | quote }}
  LOG_LEVEL: {{ .Values.logLevel | quote }}
{{- end }}
