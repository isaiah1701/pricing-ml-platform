{{- if and .Values.workload.enabled (not .Values.bootstrap.enabled) }}
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: {{ include "airbnb.fullname" . }}
  labels:
    {{- include "airbnb.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  strategy:
    canary:
      stableService: {{ include "airbnb.fullname" . }}
      canaryService: {{ include "airbnb.fullname" . }}-canary
      trafficRouting:
        traefik:
          weightedTraefikServiceName: {{ include "airbnb.fullname" . }}
      steps:
        - setWeight: {{ .Values.rollout.initialWeight }}
        - pause:
            duration: {{ .Values.rollout.pauseDuration }}
        - analysis:
            templates:
              - templateName: {{ include "airbnb.fullname" . }}-canary
            args:
              - name: canary-service
                value: {{ include "airbnb.fullname" . }}-canary
        - setWeight: 25
        - pause:
            duration: 5m
        - analysis:
            templates:
              - templateName: {{ include "airbnb.fullname" . }}-canary
            args:
              - name: canary-service
                value: {{ include "airbnb.fullname" . }}-canary
        - setWeight: 50
        - pause:
            duration: 5m
        - analysis:
            templates:
              - templateName: {{ include "airbnb.fullname" . }}-canary
            args:
              - name: canary-service
                value: {{ include "airbnb.fullname" . }}-canary
        - setWeight: 100
  selector:
    matchLabels:
      {{- include "airbnb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "airbnb.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "airbnb.serviceAccountName" . }}
      automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: inference
          image: {{ printf "%s:%s" (required "image.repository is required" .Values.image.repository) (required "image.tag is required" .Values.image.tag) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "airbnb.fullname" . }}
            {{- if .Values.existingSecret }}
            - secretRef:
                name: {{ .Values.existingSecret }}
            {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
