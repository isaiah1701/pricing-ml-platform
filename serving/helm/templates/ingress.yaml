{{- if and .Values.workload.enabled (not .Values.bootstrap.enabled) .Values.ingress.enabled }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Values.ingress.issuerName }}
spec:
  acme:
    server: {{ .Values.ingress.acmeServer | quote }}
    privateKeySecretRef:
      name: {{ .Values.ingress.issuerName }}-account
    solvers:
      - http01:
          ingress:
            ingressClassName: {{ .Values.ingress.className }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "airbnb.fullname" . }}
spec:
  secretName: {{ .Values.ingress.tlsSecretName }}
  dnsNames:
    - {{ required "ingress.host is required" .Values.ingress.host | quote }}
  issuerRef:
    name: {{ .Values.ingress.issuerName }}
    kind: Issuer
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ include "airbnb.fullname" . }}-root-redirect
spec:
  redirectRegex:
    regex: ^https://[^/]+/?$
    replacement: {{ printf "https://%s/demo" .Values.ingress.host | quote }}
    permanent: false
---
apiVersion: traefik.io/v1alpha1
kind: TraefikService
metadata:
  name: {{ include "airbnb.fullname" . }}
spec:
  weighted:
    services:
      - name: {{ include "airbnb.fullname" . }}
        port: {{ .Values.service.port }}
      - name: {{ include "airbnb.fullname" . }}-canary
        port: {{ .Values.service.port }}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ include "airbnb.fullname" . }}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`{{ .Values.ingress.host }}`) && Path(`/`)
      kind: Rule
      priority: 100
      middlewares:
        - name: {{ include "airbnb.fullname" . }}-root-redirect
      services:
        - name: {{ include "airbnb.fullname" . }}
          kind: TraefikService
    - match: Host(`{{ .Values.ingress.host }}`)
      kind: Rule
      services:
        - name: {{ include "airbnb.fullname" . }}
          kind: TraefikService
  tls:
    secretName: {{ .Values.ingress.tlsSecretName }}
{{- end }}
