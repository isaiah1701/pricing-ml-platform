{{- if and .Values.platform.enabled (not .Values.bootstrap.enabled) }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.platform.secretStoreName }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.platform.awsRegion | quote }}
  conditions:
    - namespaces:
        - {{ .Values.platform.mlflow.namespace | quote }}
        - {{ .Values.platform.airflow.namespace | quote }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mlflow-database
  namespace: {{ .Values.platform.mlflow.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.platform.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: mlflow-database
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        MLFLOW_BACKEND_STORE_URI: 'postgresql+psycopg2://{{ `{{ .username | urlquery }}` }}:{{ `{{ .password | urlquery }}` }}@{{ `{{ .host }}` }}:{{ `{{ .port }}` }}/{{ `{{ .dbname }}` }}'
  data:
    - secretKey: username
      remoteRef:
        key: {{ required "platform.mlflow.databaseSecretArn is required" .Values.platform.mlflow.databaseSecretArn | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.platform.mlflow.databaseSecretArn | quote }}
        property: password
    - secretKey: host
      remoteRef:
        key: {{ .Values.platform.mlflow.databaseSecretArn | quote }}
        property: host
    - secretKey: port
      remoteRef:
        key: {{ .Values.platform.mlflow.databaseSecretArn | quote }}
        property: port
    - secretKey: dbname
      remoteRef:
        key: {{ .Values.platform.mlflow.databaseSecretArn | quote }}
        property: dbname
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-database
  namespace: {{ .Values.platform.airflow.namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.platform.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: airflow-database
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: 'postgresql+psycopg2://{{ `{{ .username | urlquery }}` }}:{{ `{{ .password | urlquery }}` }}@{{ `{{ .host }}` }}:{{ `{{ .port }}` }}/{{ `{{ .dbname }}` }}'
  data:
    - secretKey: username
      remoteRef:
        key: {{ required "platform.airflow.databaseSecretArn is required" .Values.platform.airflow.databaseSecretArn | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ .Values.platform.airflow.databaseSecretArn | quote }}
        property: password
    - secretKey: host
      remoteRef:
        key: {{ .Values.platform.airflow.databaseSecretArn | quote }}
        property: host
    - secretKey: port
      remoteRef:
        key: {{ .Values.platform.airflow.databaseSecretArn | quote }}
        property: port
    - secretKey: dbname
      remoteRef:
        key: {{ .Values.platform.airflow.databaseSecretArn | quote }}
        property: dbname
{{- end }}
