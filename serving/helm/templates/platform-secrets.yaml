{{- if and .Values.platform.enabled (not .Values.bootstrap.enabled) }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.platform.secretStoreName }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.platform.awsRegion | quote }}
  conditions:
    - namespaces:
        - {{ .Values.platform.mlflow.namespace | quote }}
        - {{ .Values.platform.airflow.namespace | quote }}
        - "monitoring"
{{- range $component := list "mlflow" "airflow" }}
{{- $settings := index $.Values.platform $component }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $component }}-database
  namespace: {{ $settings.namespace }}
spec:
  refreshInterval: 5m0s
  secretStoreRef:
    name: {{ $.Values.platform.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: {{ $component }}-database
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        {{ if eq $component "mlflow" }}MLFLOW_BACKEND_STORE_URI{{ else }}AIRFLOW__DATABASE__SQL_ALCHEMY_CONN{{ end }}: 'postgresql+psycopg2://{{ `{{ .username | urlquery }}` }}:{{ `{{ .password | urlquery }}` }}@{{ required (printf "platform.%s.databaseHost is required" $component) $settings.databaseHost }}:{{ $settings.databasePort }}/{{ $settings.databaseName }}?sslmode=require'
        {{- if eq $component "airflow" }}
        AIRFLOW__DATABASE__SQL_ALCHEMY_CONN_ASYNC: 'postgresql+asyncpg://{{ `{{ .username | urlquery }}` }}:{{ `{{ .password | urlquery }}` }}@{{ $settings.databaseHost }}:{{ $settings.databasePort }}/{{ $settings.databaseName }}?ssl=require'
        {{- end }}
  data:
    - secretKey: username
      remoteRef:
        key: {{ required (printf "platform.%s.databaseSecretArn is required" $component) $settings.databaseSecretArn | quote }}
        property: username
    - secretKey: password
      remoteRef:
        key: {{ $settings.databaseSecretArn | quote }}
        property: password
{{- end }}
{{- if .Values.platform.airflow.generateRuntimeSecret }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: airflow-runtime
  namespace: {{ .Values.platform.airflow.namespace }}
spec:
  length: 64
  digits: 16
  symbols: 0
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airflow-runtime
  namespace: {{ .Values.platform.airflow.namespace }}
spec:
  refreshPolicy: CreatedOnce
  target:
    name: airflow-runtime
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        AIRFLOW__API_AUTH__JWT_SECRET: '{{ `{{ printf "jwt:%s" .password | sha256sum }}` }}'
        AIRFLOW__API__SECRET_KEY: '{{ `{{ printf "api:%s" .password | sha256sum }}` }}'
        AIRFLOW__CORE__FERNET_KEY: '{{ `{{ printf "fernet:%s" .password | sha256sum | trunc 32 | b64enc }}` }}'
        AIRFLOW_ADMIN_PASSWORD: '{{ `{{ printf "admin:%s" .password | sha256sum }}` }}'
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: airflow-runtime
{{- end }}
{{- if .Values.platform.grafanaAlerting.notifications.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-smtp
  namespace: monitoring
spec:
  refreshInterval: 5m0s
  secretStoreRef:
    name: {{ .Values.platform.secretStoreName }}
    kind: ClusterSecretStore
  target:
    name: grafana-smtp
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      data:
        GF_SMTP_ENABLED: "true"
        GF_SMTP_HOST: '{{ `{{ .host }}` }}'
        GF_SMTP_USER: '{{ `{{ .username }}` }}'
        GF_SMTP_PASSWORD: '{{ `{{ .password }}` }}'
        GF_SMTP_FROM_ADDRESS: '{{ `{{ .from_address }}` }}'
        GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
  dataFrom:
    - extract:
        key: {{ required "platform.grafanaAlerting.notifications.smtpSecretArn is required" .Values.platform.grafanaAlerting.notifications.smtpSecretArn | quote }}
{{- end }}
{{- end }}
