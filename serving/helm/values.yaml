bootstrap:
  enabled: false

# Child production Applications enable this; offline CI can render templates.
launchValidation: false

workload:
  enabled: true

image:
  repository: airbnb-price-predictor
  tag: dev
  digest: ""
  pullPolicy: IfNotPresent

trainingImage:
  repository: airbnb-model-training
  tag: dev
  digest: ""

rollout:
  initialWeight: 5
  pauseDuration: 2m
  analysisInterval: 1m
  analysisCount: 3
  minimumRequests: 20
  errorRateThreshold: 0.05
  p95LatencyThresholdSeconds: 0.25

prometheus:
  address: http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090

ingress:
  enabled: false
  className: traefik
  host: ""
  tlsSecretName: airbnb-inference-tls
  issuerName: letsencrypt
  acmeServer: https://acme-v02.api.letsencrypt.org/directory

monitoring:
  productionEvents:
    bucket: ""
    prefix: production/events
  serviceMonitor:
    enabled: false
    prometheusRelease: kube-prometheus-stack
    interval: 15s
    scrapeTimeout: 10s

replicaCount: 1

service:
  type: ClusterIP
  port: 80
  targetPort: 8000

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

mlflow:
  trackingUri: http://mlflow.mlflow.svc.cluster.local:5000
  modelName: airbnb-price-predictor
  modelAlias: champion
  tracing:
    enabled: true
    experimentId: "1"
    serviceName: airbnb-inference
    environment: production

logLevel: INFO
existingSecret: ""

runtime:
  maxConcurrentPredictions: 1
  predictionQueueTimeoutSeconds: 5
  nativeThreads: 1

serviceAccount:
  create: true
  name: ""
  automountServiceAccountToken: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

nodeSelector: {}
tolerations: []
affinity: {}
terminationGracePeriodSeconds: 30

externalSecret:
  enabled: false
  name: airbnb-inference-runtime
  refreshInterval: 1h
  secretStoreName: airbnb-aws-secrets-manager
  aws:
    region: eu-west-2
    secretId: prod-mlops/prod/inference
  properties: []

git:
  repoURL: ""
  targetRevision: main
  chartPath: serving/helm

project:
  name: prod-mlops

destination:
  server: https://kubernetes.default.svc
  namespace: airbnb-inference

syncPolicy:
  automated: false
  prune: true
  selfHeal: true

externalSecretsOperator:
  name: external-secrets
  namespace: external-secrets
  chartRepo: https://charts.external-secrets.io
  chart: external-secrets
  chartVersion: 0.20.4
  serviceAccountName: external-secrets

argoRollouts:
  name: argo-rollouts
  namespace: argo-rollouts
  chartRepo: https://argoproj.github.io/argo-helm
  chart: argo-rollouts
  chartVersion: 2.43.2

addons: {}

platform:
  enabled: false
  awsRegion: eu-west-2
  secretStoreName: platform-aws-secrets-manager
  grafanaAlerting:
    notifications:
      enabled: false
      email: ""
      smtpSecretArn: ""
      mode: smtp
      alertmanagerUrl: http://kube-prometheus-stack-alertmanager.monitoring.svc.cluster.local:9093
  publicIngress:
    enabled: false
    grafanaHost: ""
    mlflowHost: ""
    issuerName: letsencrypt
    acmeServer: https://acme-v02.api.letsencrypt.org/directory
    mlflowAuthSecretName: mlflow-public-auth
    mlflowAuthRemoteKey: ""
  mlflow:
    namespace: mlflow
    serviceAccountName: mlflow
    replicas: 2
    databaseSecretArn: ""
    databaseHost: ""
    databasePort: 5432
    databaseName: mlflow
    artifactRoot: ""
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi
  airflow:
    # Disable when restoring the existing airflow-runtime Secret with an RDS snapshot.
    generateRuntimeSecret: true
    nodeSelector:
      workload: training
    componentResources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi
    namespace: airflow
    serviceAccountName: airflow
    databaseSecretArn: ""
    databaseHost: ""
    databasePort: 5432
    databaseName: airflow
    parallelism: 2
    adminUsername: admin
    adminEmail: admin@localhost
    dataBucket: ""
    rawDataKey: data/AB_NYC_2019.csv
    redisConnectionString: ""
    storageClassName: gp3
    storageSize: 100Gi
    dataBootstrapEnabled: true
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "3"
        memory: 6Gi
