bootstrap:
  enabled: true
workload:
  enabled: false
git:
  repoURL: https://github.com/isaiah1701/prod-mlops-platform.git
  targetRevision: main
  chartPath: serving/helm
project:
  name: prod-mlops
destination:
  server: https://kubernetes.default.svc
  namespace: airbnb-inference
addons:
  reloader:
    enabled: true
    name: reloader
    namespace: kube-system
    syncWave: '-3'
    chartRepo: https://stakater.github.io/stakater-charts
    chart: reloader
    chartVersion: 2.2.18
    values:
      reloader:
        reloadStrategy: annotations
        deployment:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          nodeSelector:
            workload: system
  certManager:
    enabled: true
    name: cert-manager
    namespace: cert-manager
    syncWave: '-3'
    chartRepo: https://charts.jetstack.io
    chart: cert-manager
    chartVersion: v1.21.2
    values:
      crds:
        enabled: true
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
      webhook:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
      cainjector:
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 256Mi
      nodeSelector:
        workload: system
  traefik:
    enabled: true
    name: traefik
    namespace: traefik
    syncWave: '-2'
    chartRepo: https://traefik.github.io/charts
    chart: traefik
    chartVersion: 41.7.1
    values:
      deployment:
        replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          memory: 256Mi
      nodeSelector:
        workload: system
      providers:
        kubernetesCRD:
          enabled: true
        kubernetesIngress:
          enabled: true
          publishedService:
            enabled: true
      ports:
        web:
          http:
            redirections:
              entryPoint:
                to: websecure
                scheme: https
                permanent: true
                priority: 1
      service:
        annotations:
          service.beta.kubernetes.io/aws-load-balancer-type: external
          service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
          service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
          external-dns.kubernetes.io/hostname: platf0rm.site,grafana.platf0rm.site,mlflow.platf0rm.site
  awsLoadBalancerController:
    enabled: true
    name: aws-load-balancer-controller
    namespace: kube-system
    syncWave: '-2'
    chartRepo: https://aws.github.io/eks-charts
    chart: aws-load-balancer-controller
    chartVersion: 3.6.0
    values:
      enableCertManager: true
      clusterName: prod-mlops-prod
      region: eu-west-2
      replicaCount: 1
      resources:
        requests:
          cpu: 50m
          memory: 128Mi
        limits:
          memory: 256Mi
      serviceAccount:
        create: true
        name: aws-load-balancer-controller
  metricsServer:
    enabled: true
    name: metrics-server
    namespace: kube-system
    syncWave: '-3'
    chartRepo: https://kubernetes-sigs.github.io/metrics-server/
    chart: metrics-server
    chartVersion: 3.14.0
    values:
      replicas: 1
      resources:
        requests:
          cpu: 50m
          memory: 96Mi
        limits:
          memory: 256Mi
  clusterAutoscaler:
    enabled: false
    name: cluster-autoscaler
    namespace: kube-system
    syncWave: '-3'
    chartRepo: https://kubernetes.github.io/autoscaler
    chart: cluster-autoscaler
    chartVersion: 9.59.0
    values:
      autoDiscovery:
        clusterName: prod-mlops-prod
      awsRegion: eu-west-2
      rbac:
        serviceAccount:
          create: true
          name: cluster-autoscaler
      extraArgs:
        balance-similar-node-groups: 'true'
        expander: least-waste
        skip-nodes-with-system-pods: 'false'
  externalDns:
    enabled: true
    name: external-dns
    namespace: kube-system
    syncWave: '-3'
    chartRepo: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    chartVersion: 1.23.0
    values:
      provider:
        name: aws
      policy: sync
      registry: txt
      txtOwnerId: prod-mlops-prod
      domainFilters:
      - platf0rm.site
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
        limits:
          memory: 256Mi
      serviceAccount:
        create: true
        name: external-dns
  monitoring:
    enabled: true
    name: kube-prometheus-stack
    namespace: monitoring
    syncWave: '-2'
    # Preserve Grafana's generated login across Helm renders and manual syncs.
    ignoreDifferences:
      - group: ''
        kind: Secret
        name: kube-prometheus-stack-grafana
        namespace: monitoring
        jsonPointers:
          - /data/admin-password
      - group: apps
        kind: Deployment
        name: kube-prometheus-stack-grafana
        namespace: monitoring
        jsonPointers:
          - /spec/template/metadata/annotations/checksum~1secret
    chartRepo: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    chartVersion: 92.3.0
    values:
      grafana:
        enabled: true
        envFromSecrets:
          - name: grafana-smtp
            optional: true
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 384Mi
        sidecar:
          alerts:
            enabled: true
            searchNamespace: ALL
          dashboards:
            enabled: true
            searchNamespace: ALL
      prometheus:
        prometheusSpec:
          retention: 2d
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1Gi
          serviceMonitorSelectorNilUsesHelmValues: false
          podMonitorSelectorNilUsesHelmValues: false
          nodeSelector:
            workload: system
          storageSpec:
            volumeClaimTemplate:
              spec:
                storageClassName: gp3
                accessModes:
                - ReadWriteOnce
                resources:
                  requests:
                    storage: 10Gi
      alertmanager:
        enabled: true
        config:
          global:
            resolve_timeout: 5m
          route:
            receiver: platform-sns
            group_by:
            - alertname
            - service
            - severity
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            routes:
            - receiver: "null"
              matchers: ['alertname="Watchdog"']
            - receiver: platform-sns
              matchers: ['service="airbnb-price-predictor"', 'environment="production"']
              repeat_interval: 7d
          receivers:
          - name: "null"
          - name: platform-sns
            sns_configs:
            - topic_arn: arn:aws:sns:eu-west-2:655916164714:prod-mlops-prod-alerts
              send_resolved: true
              sigv4:
                region: eu-west-2
        alertmanagerSpec:
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          nodeSelector:
            workload: system
          storage:
            volumeClaimTemplate:
              spec:
                storageClassName: gp3
                accessModes:
                - ReadWriteOnce
                resources:
                  requests:
                    storage: 2Gi
      prometheusOperator:
        resources:
          requests:
            cpu: 25m
            memory: 96Mi
          limits:
            memory: 256Mi
      kube-state-metrics:
        metricLabelsAllowlist:
        - pods=[rollouts-pod-template-hash]
        rbac:
          extraRules:
          - apiGroups:
            - argoproj.io
            resources:
            - rollouts
            - analysisruns
            verbs:
            - get
            - list
            - watch
          - apiGroups:
            - apiextensions.k8s.io
            resources:
            - customresourcedefinitions
            verbs:
            - list
            - watch
        customResourceState:
          enabled: true
          config:
            kind: CustomResourceStateMetrics
            spec:
              resources:
              - groupVersionKind:
                  group: argoproj.io
                  version: v1alpha1
                  kind: Rollout
                metricNamePrefix: mlops
                labelsFromPath:
                  namespace:
                  - metadata
                  - namespace
                  rollout:
                  - metadata
                  - name
                metrics:
                - name: rollout_info
                  help: Current observed rollout phase and desired pod revision.
                  labelsFromPath:
                    phase:
                    - status
                    - phase
                    revision:
                    - status
                    - currentPodHash
                  each:
                    type: Info
                    info:
                      path:
                      - metadata
                - name: rollout_aborted
                  help: Whether the current Rollout is explicitly aborted.
                  each:
                    type: Gauge
                    gauge:
                      path: [status, abort]
                      nilIsZero: true
                - name: rollout_stable_info
                  help: Retained stable rollout pod revision.
                  labelsFromPath:
                    revision:
                    - status
                    - stableRS
                  each:
                    type: Info
                    info:
                      path:
                      - metadata
              - groupVersionKind:
                  group: argoproj.io
                  version: v1alpha1
                  kind: AnalysisRun
                metricNamePrefix: mlops
                labelsFromPath:
                  namespace:
                  - metadata
                  - namespace
                  analysisrun:
                  - metadata
                  - name
                  phase:
                  - status
                  - phase
                metrics:
                - name: analysis_run_info
                  help: Current retained canary analysis phase.
                  each:
                    type: Info
                    info:
                      path:
                      - metadata
        resources:
          requests:
            cpu: 10m
            memory: 64Mi
          limits:
            memory: 192Mi
      prometheus-node-exporter:
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
  pushgateway:
    enabled: true
    name: prometheus-pushgateway
    namespace: monitoring
    syncWave: '-2'
    chartRepo: https://prometheus-community.github.io/helm-charts
    chart: prometheus-pushgateway
    chartVersion: 3.9.1
    values:
      serviceMonitor:
        enabled: true
        namespace: monitoring
        additionalLabels:
          release: kube-prometheus-stack
      extraArgs:
        - --persistence.file=/data/pushgateway.data
        - --persistence.interval=1m
      persistentVolume:
        enabled: true
        size: 1Gi
        storageClass: gp3
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 128Mi
      nodeSelector:
        workload: system
