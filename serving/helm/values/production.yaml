# Replace the repository and immutable tag during the image-promotion workflow.
image:
  repository: "REPLACE_WITH_ECR_REPOSITORY"
  tag: "sha-REPLACE_WITH_GIT_SHA"
  pullPolicy: IfNotPresent

trainingImage:
  repository: "REPLACE_WITH_TRAINING_ECR_REPOSITORY"
  tag: "sha-REPLACE_WITH_GIT_SHA"

ingress:
  enabled: true
  className: traefik
  host: "platf0rm.site"

monitoring:
  serviceMonitor:
    enabled: true

replicaCount: 1

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 70

nodeSelector:
  workload: system

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 2Gi

tolerations:
  - key: workload
    operator: Equal
    value: serving
    effect: NoSchedule

externalSecret:
  enabled: false

existingSecret: ""

platform:
  enabled: false
  awsRegion: eu-west-2
  mlflow:
    replicas: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi
    databaseSecretArn: "REPLACE_WITH_MLFLOW_DATABASE_SECRET_ARN"
    databaseHost: "REPLACE_WITH_MLFLOW_DATABASE_HOST"
    artifactRoot: "s3://REPLACE_WITH_PLATFORM_DATA_BUCKET/mlflow"
  airflow:
    parallelism: 1
    nodeSelector:
      workload: system
    storageSize: 20Gi
    componentResources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        cpu: "1"
        memory: 1Gi
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 4Gi
    databaseSecretArn: "REPLACE_WITH_AIRFLOW_DATABASE_SECRET_ARN"
    databaseHost: "REPLACE_WITH_AIRFLOW_DATABASE_HOST"
    dataBucket: "REPLACE_WITH_PLATFORM_DATA_BUCKET"
    redisConnectionString: "REPLACE_WITH_REDIS_CONFIGURATION_ENDPOINT:6379,ssl=true"
