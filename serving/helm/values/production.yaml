# Replace the repository and immutable tag during the image-promotion workflow.
image:
  repository: "REPLACE_WITH_ECR_REPOSITORY"
  tag: "sha-REPLACE_WITH_GIT_SHA"
  pullPolicy: IfNotPresent

trainingImage:
  repository: "REPLACE_WITH_TRAINING_ECR_REPOSITORY"
  tag: "sha-REPLACE_WITH_GIT_SHA"

ingress:
  enabled: true
  className: alb
  scheme: internet-facing
  certificateArn: ""
  host: "prices.5hort.site"

monitoring:
  serviceMonitor:
    enabled: true

replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

nodeSelector:
  workload: serving

tolerations:
  - key: workload
    operator: Equal
    value: serving
    effect: NoSchedule

externalSecret:
  enabled: false

existingSecret: ""

platform:
  enabled: false
  awsRegion: eu-west-2
  mlflow:
    databaseSecretArn: "REPLACE_WITH_MLFLOW_DATABASE_SECRET_ARN"
    artifactRoot: "s3://REPLACE_WITH_PLATFORM_DATA_BUCKET/mlflow"
  airflow:
    databaseSecretArn: "REPLACE_WITH_AIRFLOW_DATABASE_SECRET_ARN"
    dataBucket: "REPLACE_WITH_PLATFORM_DATA_BUCKET"
    redisConnectionString: "rediss://REPLACE_WITH_REDIS_CONFIGURATION_ENDPOINT:6379"
